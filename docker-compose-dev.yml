version: '3.7'

services:
  backend:
    build: ./BACKEND
    container_name: backend
    command: gunicorn -b 0.0.0.0:8000 sociallogin.wsgi 
    volumes:
      - static_volume:/static
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      - is_prod=False
      - ALLOWED_HOSTS=
      - CORS_ALLOWED_ORIGINS=
      - FRONTEND_URL=
      - CSRF_TRUSTED_ORIGINS=
      - POSTGRES_NAME=
      - POSTGRES_USER=
      - POSTGRES_PASSWORD=
      - POSTGRES_HOST=
      - POSTGRES_PORT=
      - ACCOUNT_DEFAULT_HTTP_PROTOCOL=http
      - SECRET_KEY=
    networks:
      - mynetwork
    develop:
      watch:
        - action: rebuild
          path: ./BACKEND
      
  frontend:
    build: 
      context: ./FRONTEND
      target: develop
    container_name: frontend
    expose: 
      - 9000
    ports:
      - "9000:9000"
    networks:
      - mynetwork
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ./FRONTEND 
    entrypoint: /bin/sh -c "quasar dev -p 9000"
  
  proxy:
    build: 
      context: ./PROXY
      target: dev
    container_name: proxy
    volumes:
      - static_volume:/static
    ports:
      - "80:80"
    networks:
      - mynetwork
    depends_on:
      - backend
      - frontend
    develop:
      watch:
        - action: rebuild
          path: PROXY/
networks:
  mynetwork:
    driver: bridge

volumes:
  static_volume:


